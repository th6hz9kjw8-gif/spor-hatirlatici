<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günlük Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eceff1;--card:#fff;--ink:#14202b;--mut:#5d6b78;--acc:#1f4fff;--ac2:#e8541c;--line:#d5dbe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#1a232c;--ink:#e8edf1;--mut:#93a1ad;--acc:#7f9bff;--ac2:#ff8a5c;--line:#2a3640;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--card:#1a232c;--ink:#e8edf1;--mut:#93a1ad;--acc:#7f9bff;--ac2:#ff8a5c;--line:#2a3640;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:0 0 4px}
h2{font-size:20px;font-weight:800;margin:26px 0 8px}
.hero{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px}
.hero small{font-size:18px;font-weight:600;letter-spacing:0;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.sub{color:var(--mut);font-size:14px}
.box{background:var(--card);border-radius:14px;padding:6px 16px;margin:8px 0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macros b{font-size:18px}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,nav a:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
label.f{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:48%}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
.done{text-decoration:line-through;color:var(--mut)}
.today{border-left:4px solid var(--ac2);padding-left:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:14px 0;font-weight:600;color:var(--mut);text-decoration:none}
nav a.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const key=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const DN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const wd=(new Date().getDay()+6)%7;
let P=ld('prof',{age:21,h:176,w:52,act:1.55,goal:400,days:4});
let D=ld('day-'+key,{meals:[],done:{},water:0,sleep:false});
let tab='bugun',seed=0;
const save=()=>{sv('prof',P);sv('day-'+key,D)};

const E={bench:'Bench Press|Göğüs|4x8',inc:'Eğimli Dumbbell Press|Üst göğüs|3x10',ohp:'Omuz Press|Omuz|3x10',lat:'Lateral Raise|Yan omuz|3x15',tri:'Triceps Pushdown|Triceps|3x12',
pull:'Lat Pulldown|Sırt|4x10',row:'Oturarak Kürek|Orta sırt|3x10',face:'Face Pull|Arka omuz|3x15',curl:'Dumbbell Curl|Biceps|3x10',ham:'Hammer Curl|Biceps|2x12',
sq:'Squat|Ön bacak|4x8',rdl:'Romanian Deadlift|Arka bacak|3x10',lp:'Leg Press|Bacak|3x12',calf:'Baldır Press|Baldır|4x15',plank:'Plank|Karın|3x45sn',
hip:'Hip Thrust|Kalça|3x10',lc:'Leg Curl|Arka bacak|3x12',cr:'Crunch|Karın|3x15'};
const PR={
3:{0:['Full Body A',['sq','bench','row','plank']],2:['Full Body B',['rdl','ohp','pull','curl','tri']],4:['Full Body C',['lp','inc','row','lat','calf']]},
4:{0:['Üst Vücut A',['bench','row','ohp','curl','tri']],1:['Alt Vücut A',['sq','rdl','calf','plank']],3:['Üst Vücut B',['inc','pull','lat','face','ham','tri']],4:['Alt Vücut B',['lp','hip','lc','calf','cr']]},
5:{0:['İtiş (Göğüs, Omuz, Triceps)',['bench','inc','ohp','lat','tri']],1:['Çekiş (Sırt, Biceps)',['pull','row','face','curl','ham']],2:['Bacak',['sq','rdl','lp','calf','plank']],4:['Üst Vücut',['bench','row','ohp','curl','tri']],5:['Alt Vücut + Karın',['lp','hip','lc','calf','cr']]}};
const AC=[[1.2,'Hareketsiz (derse oturuyorsun)'],[1.375,'Hafif aktif (1-3 gün spor)'],[1.55,'Orta aktif (3-5 gün spor)'],[1.725,'Çok aktif (6-7 gün)']];
const GO=[[400,'Kilo / kas al (+400)'],[0,'Kiloyu koru'],[-400,'Yağ ver (-400)']];
const R=[
['Yulaflı muzlu kase','yulaf, süt, muz, fıstık ezmesi',620,24,82,22],
['Menemen + ekmek','3 yumurta, domates, biber, 3 dilim tam buğday ekmek',520,26,38,28],
['Tavuklu pilav + yoğurt','200 g tavuk göğsü, pirinç pilavı, yoğurt',720,48,85,20],
['Ton balıklı makarna','makarna, ton balığı, mısır, zeytinyağı',680,42,88,16],
['Köfte, bulgur, cacık','150 g köfte, bulgur pilavı, cacık',760,45,70,32],
['Muzlu yulaflı shake','süt, yulaf, muz, bal',480,22,65,14],
['Mercimek çorbası + yumurta','çorba, 2 haşlanmış yumurta, ekmek',550,28,62,18],
['Fıstık ezmeli tost + süt','tam buğday ekmek, fıstık ezmesi, süt',520,22,52,24],
['Fırın tavuk, patates, salata','tavuk but, fırın patates, mevsim salata',650,50,55,20],
['Cevizli yoğurt kasesi','lor veya süzme yoğurt, ceviz, bal',380,28,30,16],
['Peynirli omlet + ekmek','3 yumurta, beyaz peynir, 2 dilim ekmek',450,30,28,24],
['Kuru fasulye + pilav','kuru fasulye, pirinç pilavı, turşu',680,28,100,18],
['Hindi dürüm','lavaş, hindi göğüs, yoğurt, marul',560,40,52,18],
['Nohutlu tavuk pilavı','tavuk, nohut, pirinç, yoğurt',700,45,80,20],
['Kıymalı makarna + yoğurt','makarna, 120 g kıyma, domates sosu, yoğurt',740,38,90,22],
['Ton balıklı sandviç','ekmek, ton balığı, yoğurt, marul, domates',480,34,46,16],
['Fıstık ezmeli muzlu ekmek','tam buğday ekmek, fıstık ezmesi, muz',430,14,58,18],
['Yulaflı pankek','yulaf, 2 yumurta, muz, süt',520,30,60,16],
['Etli nohut + bulgur','kuşbaşı et, nohut, bulgur pilavı',720,40,78,26],
['Somon, patates, brokoli','fırında somon, haşlanmış patates, brokoli',660,42,50,30],
['Fıstık ezmeli shake','süt, muz, fıstık ezmesi, yulaf',560,22,62,24],
['Kuruyemiş + süt','bir avuç badem, ceviz, fındık, 1 bardak süt',480,18,34,30]];

function calc(){const bmr=10*P.w+6.25*P.h-5*P.age+5,tdee=bmr*P.act,kcal=Math.round(tdee+P.goal),p=Math.round(2*P.w),f=Math.round(kcal*.25/9),c=Math.round((kcal-p*4-f*9)/4);return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p,f,c,su:(P.w*.04+.5).toFixed(1)}}
const tot=()=>D.meals.reduce((a,m)=>({k:a.k+m[2],p:a.p+m[3],c:a.c+m[4],f:a.f+m[5]}),{k:0,p:0,c:0,f:0});
const wk=()=>PR[P.days][wd];
const ex=k=>E[k].split('|');
const bar=(v,m)=>`<div class="bar"><i style="width:${Math.min(100,v/m*100)}%"></i></div>`;

function vBugun(){const c=calc(),t=tot(),w=wk(),left=c.kcal-t.k;
let h=`<h1>${DN[wd]}</h1><div class="hero">${Math.abs(left)}<small> kcal ${left>=0?'kaldı':'fazla'}</small></div>${bar(t.k,c.kcal)}
<div class="macros"><div><b>${t.p}/${c.p}</b><div class="sub">protein g</div></div><div><b>${t.c}/${c.c}</b><div class="sub">karbonhidrat g</div></div><div><b>${t.f}/${c.f}</b><div class="sub">yağ g</div></div></div>
<h2>Antrenman</h2><div class="box">`;
if(!w)h+=`<div class="row"><span>Bugün dinlenme günü. Kaslar dinlenirken büyür; uyku ve yemek öncelik.</span></div>`;
else{h+=`<div class="row"><b>${w[0]}</b></div>`;w[1].forEach(k=>{const e=ex(k),d=D.done[k];h+=`<label class="row"><span class="${d?'done':''}">${e[0]}<div class="sub">${e[1]} · ${e[2]}</div></span><input type="checkbox" ${d?'checked':''} onchange="tg('${k}')"></label>`})}
h+=`</div><h2>Günlük hatırlatma</h2><div class="box">
<div class="row"><span>Su: ${(D.water/1000).toFixed(2)} / ${c.su} L</span><span><button class="g" onclick="wat(-250)">-</button> <button onclick="wat(250)">+250 ml</button></span></div>
<label class="row"><span class="${D.sleep?'done':''}">Dün gece 7-8 saat uyudum</span><input type="checkbox" ${D.sleep?'checked':''} onchange="D.sleep=!D.sleep;save();r()"></label></div>
<h2>Günün akışı</h2>${vAkis()}<h2>Yediklerim</h2><div class="box">`;
if(!D.meals.length)h+=`<div class="row"><span class="sub">Henüz bir şey eklemedin.</span><button onclick="go('yemek')">Yemek ekle</button></div>`;
D.meals.forEach((m,i)=>h+=`<div class="row"><span>${m[0]}<div class="sub">${m[2]} kcal · ${m[3]} g protein</div></span><button class="g" onclick="rm(${i})">Sil</button></div>`);
return h+'</div>'}

function vPlan(){let h=`<h1>Haftalık program</h1><div class="box"><label class="f">Haftada kaç gün<select onchange="P.days=+this.value;save();r()">${[3,4,5].map(n=>`<option value="${n}" ${P.days==n?'selected':''}>${n} gün</option>`).join('')}</select></label></div>`;
DN.forEach((n,i)=>{const w=PR[P.days][i];h+=`<div class="box ${i==wd?'today':''}"><div class="row"><b>${n}</b><span class="sub">${w?w[0]:'Dinlenme'}</span></div>`;if(w)w[1].forEach(k=>{const e=ex(k);h+=`<div class="row"><span>${e[0]}<div class="sub">${e[1]}</div></span><b>${e[2]}</b></div>`});h+='</div>'});
return h+`<p class="sub">Her harekette son sette zorlanacağın ağırlığı seç. Tüm setleri tamamlayınca bir sonraki antrenmanda ağırlığı biraz artır.</p>`}

function vYemek(){const o=[0,1,2].map(i=>R[(Math.floor(Date.now()/864e5)+seed*3+i*3)%R.length]);
let h=`<h1>Bugünün önerileri</h1><p class="sub">Hedefin ${calc().kcal} kcal. Üç öğün ve bir ara öğün için seç.</p>`;
o.forEach(m=>{const i=R.indexOf(m);h+=`<div class="box"><div class="row"><span><b>${m[0]}</b><div class="sub">${m[1]}</div><div class="sub">${m[2]} kcal · P${m[3]} K${m[4]} Y${m[5]}</div></span><button onclick="add(${i})">Ekle</button></div></div>`});
h+=`<button class="g" onclick="seed++;r()">Başka öneri göster</button><h2>Tüm tarifler</h2><div class="box">`;
R.forEach((m,i)=>{h+=`<div class="row"><span>${m[0]}<div class="sub">${m[2]} kcal · P${m[3]} K${m[4]} Y${m[5]}</div></span><button class="g" onclick="add(${i})">Ekle</button></div>`});
return h+'</div>'}

function tm(s,m){const [h,mi]=s.split(':').map(Number),t=((h*60+mi+m)%1440+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function vAkis(){const T=P.tt||'18:00',W=P.wk||'08:00',w=wk();
const it=[[tm(W,30),'Kahvaltı',w?'Karbonhidrat + protein (yulaf, yumurta, süt)':'Karbonhidrat + protein. 5 g kreatini bununla al']];
if(w){it.push([tm(T,-150),'Antrenman öncesi ana öğün','Pirinç veya makarna + tavuk ya da köfte, yağı az tut'],[tm(T,-45),'Hafif atıştırma','Muz veya yulaf, su'],[T,'Antrenman',w[0]],[tm(T,75),'Gainer + kreatin','1 ölçek gainer (önce yarım dene) + 5 g kreatin, suyla veya sütle'],[tm(T,210),'Akşam yemeği','Protein + karbonhidrat + sebze']);}
else it.push([tm(W,360),'Ara öğün','Kalori açığın varsa 1 ölçek gainer'],['20:00','Akşam yemeği','Protein + karbonhidrat + sebze']);
it.push(['23:00','Yatmadan önce','Lor veya yoğurt + ceviz, sonra uyku']);
return '<div class="box">'+it.map(x=>`<div class="row"><span><b>${x[1]}</b><div class="sub">${x[2]}</div></span><b>${x[0]}</b></div>`).join('')+'</div>'}
let WL=ld('wlog',[]);
function kaydetKilo(){const v=parseFloat($('#kw').value);if(!(v>30&&v<200))return;WL=WL.filter(x=>x.d!=key);WL.push({d:key,w:v});WL.sort((a,b)=>a.d<b.d?-1:1);sv('wlog',WL);P.w=v;save();r()}
function silKilo(i){WL.splice(i,1);sv('wlog',WL);r()}
function vKilo(){const L=WL,n=L.length;
let h=`<h1>Kilo takibi</h1><div class='box'><label class='f'>Bugünkü kilo (kg)<input id='kw' type='number' step='0.1' value='${n?L[n-1].w:P.w}'></label><div class='row'><span class='sub'>Sabah, kahvaltıdan önce tart.</span><button onclick='kaydetKilo()'>Kaydet</button></div></div>`;
if(n>1){const a=L[0],b=L[n-1],gun=Math.max(1,(new Date(b.d)-new Date(a.d))/864e5),hf=(b.w-a.w)/gun*7,ws=L.map(x=>x.w),mn=Math.min(...ws)-1,mx=Math.max(...ws)+1;
const pts=L.map((x,i)=>`${20+i*300/(n-1)},${110-(x.w-mn)/(mx-mn)*100}`).join(' ');
let tip='';if(gun>=14&&P.goal>0)tip=hf<0.2?'Kilo alma hızın düşük. Günlük kaloriye +150 kcal ekle, bir ara öğün veya gainer yeter.':hf>0.6?'Hızlı kilo alıyorsun, bir kısmı yağ olabilir. Porsiyonları biraz azalt.':'İdeal hızdasın, böyle devam et.';
h+=`<h2>Grafik</h2><svg viewBox='0 0 340 120' width='100%' role='img' aria-label='Kilo grafiği'><polyline points='${pts}' fill='none' stroke='var(--acc)' stroke-width='3' stroke-linejoin='round'/></svg><p>Başlangıç ${a.w} kg, şimdi ${b.w} kg. Haftalık ortalama: <b>${hf>0?'+':''}${hf.toFixed(2)} kg</b></p><p class='sub'>${tip}</p>`}
h+=`<h2>Kayıtlar</h2><div class='box'>`;
if(!n)h+=`<div class='row'><span class='sub'>İlk kilonu kaydet.</span></div>`;
L.slice().reverse().slice(0,10).forEach(x=>{const i=L.indexOf(x);h+=`<div class='row'><span>${x.d}</span><b>${x.w} kg</b><button class='g' onclick='silKilo(${i})'>Sil</button></div>`});
return h+'</div>'}
function vHesap(){const c=calc();
const sel=(a,v,f)=>`<select onchange="${f}">${a.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`).join('')}</select>`;
return `<h1>Kalori hesabı</h1><div class="box">
<label class="f">Yaş<input type="number" value="${P.age}" onchange="P.age=+this.value;save();r()"></label>
<label class="f">Boy (cm)<input type="number" value="${P.h}" onchange="P.h=+this.value;save();r()"></label>
<label class="f">Kilo (kg)<input type="number" value="${P.w}" onchange="P.w=+this.value;save();r()"></label>
<label class="f">Aktivite${sel(AC,P.act,'P.act=+this.value;save();r()')}</label>
<label class="f">Hedef${sel(GO,P.goal,'P.goal=+this.value;save();r()')}</label>
<label class="f">Uyanma saati<input type="time" value="${P.wk||'08:00'}" onchange="P.wk=this.value;save();r()"></label>
<label class="f">Antrenman saati<input type="time" value="${P.tt||'18:00'}" onchange="P.tt=this.value;save();r()"></label></div>
<h2>Sonuç</h2><div class="hero">${c.kcal}<small> kcal/gün</small></div>
<p class="sub">Bazal metabolizma ${c.bmr} kcal, günlük harcama ${c.tdee} kcal. Protein ${c.p} g, karbonhidrat ${c.c} g, yağ ${c.f} g, su ${c.su} L.</p>
<p class="sub">Haftada 0,25-0,5 kg almak idealdir. İki hafta boyunca kilon değişmezse hedefi +100-200 kcal artır. Bu hesap tahmindir, doktor veya diyetisyen tavsiyesinin yerini tutmaz.</p>`}

function r(){const v={bugun:vBugun,plan:vPlan,yemek:vYemek,kilo:vKilo,hesap:vHesap}[tab]();$('#app').innerHTML=v;
$('#nav').innerHTML=[['bugun','Bugün'],['plan','Program'],['yemek','Tarifler'],['kilo','Kilo'],['hesap','Hesap']].map(t=>`<a href="#" class="${tab==t[0]?'on':''}" onclick="go('${t[0]}');return false">${t[1]}</a>`).join('')}
function go(t){tab=t;r();scrollTo(0,0)}
function tg(k){D.done[k]=!D.done[k];save();r()}
function wat(n){D.water=Math.max(0,D.water+n);save();r()}
function add(i){D.meals.push(R[i]);save();go('bugun')}
function rm(i){D.meals.splice(i,1);save();r()}
r();
</script></body></html>
